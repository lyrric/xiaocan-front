<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xiaocan</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Vue 加载前同步判断，避免 NavBar 闪烁
      if (window.location.pathname.startsWith('/s/')) {
        document.getElementById('app').setAttribute('data-hide-nav', 'true')
      }
    </script>
    <style>
      #app[data-hide-nav="true"] .navbar { display: none !important; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
